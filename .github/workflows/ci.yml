name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  parity:
    # Proves the TypeScript engines still agree with their own vectors. Drift
    # between TS and the Python donors is caught by the reciprocal job in each
    # donor repo, which checks this package out as a sibling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build

      - name: Golden vectors are in sync with the engines
        run: |
          node spec/generate_vectors.mjs
          if ! git diff --quiet -- spec/golden-vectors/; then
            echo "::error::spec/golden-vectors/ is stale — run node spec/generate_vectors.mjs and commit the result"
            git diff -- spec/golden-vectors/
            exit 1
          fi

      - name: TypeScript control passes every suite
        run: python3 spec/run_parity.py --adapter-cmd "node spec/adapters/ts_adapter.mjs"
